[package]
name = "desktop-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1.12.1"
enigo = "0.6.1"
futures = "0.3.34"
openh264 = "0.9.9"
rand = "0.10.3"
rtc = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
wayland-sys = { version = "0.31.11", features = ["dlopen"] }
webrtc = "0.21.1"
xcap = "0.9.8"

[dev-dependencies]
env_logger = "0.11.11"

# xcap 0.9.8 drops the D-Bus connection that owns the Wayland ScreenCast
# portal session as soon as video_recorder() returns, which kills the
# session (and Mutter's PipeWire source node) before any frame is produced.
# vendor/xcap keeps that connection alive on the recorder instead.
[patch.crates-io]
xcap = { path = "vendor/xcap" }
